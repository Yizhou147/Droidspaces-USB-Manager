name: Build Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（三段 X.Y.Z，与 tag v<version> 一致，如 1.5.0）'
        required: true
        default: '1.5.0'

env:
  VERSION: ${{ inputs.version }}

jobs:
  check-version:
    name: 校验版本号
    runs-on: ubuntu-latest
    steps:
      - name: 必须是 X.Y.Z 三段
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "版本号必须是 X.Y.Z 三段格式" >&2
            exit 1
          fi
          echo "版本号合法：$VERSION"

  build-deb:
    name: Debian/Ubuntu (.deb)
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 从 src/ 同步代码到 deb 包目录（与 rpm/arch 同模式，避免 debian/ 与 src/ 脱节）
        run: |
          cp src/usb-manager.py debian/usr/share/usb-manager/usb-manager.py
          cp src/usb-passthrough.sh debian/usr/share/usb-manager/usb-passthrough.sh
          cp src/usb-storage-passthrough.sh debian/usr/share/usb-manager/usb-storage-passthrough.sh
          cp -r icons/. debian/usr/share/usb-manager/icons/
      - name: 更新版本号并构建 deb
        run: |
          sed -i "s|^Version: .*|Version: ${VERSION}-1|" debian/DEBIAN/control
          dpkg-deb --build debian Droidspaces_USB_Manager_all.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: Droidspaces_USB_Manager_all.deb

  build-rpm:
    name: Fedora (.rpm)
    needs: check-version
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: 准备构建环境
        run: dnf install -y --setopt=retries=5 --setopt=timeout=30 rpm-build tar
      - name: 打源码包并构建 rpm
        run: |
          mkdir -p "usb-manager-${VERSION}"
          cp -r src icons desktop LICENSE README.md "usb-manager-${VERSION}/"
          rm -rf "usb-manager-${VERSION}/src/__pycache__"
          tar czf "usb-manager-${VERSION}.tar.gz" "usb-manager-${VERSION}"
          sed -i "s|^Version:.*|Version:        ${VERSION}|" usb-manager.spec
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp "usb-manager-${VERSION}.tar.gz" rpmbuild/SOURCES/
          cp usb-manager.spec rpmbuild/SPECS/
          rpmbuild -bb --define "_topdir $PWD/rpmbuild" rpmbuild/SPECS/usb-manager.spec
          cp rpmbuild/RPMS/noarch/*.rpm Droidspaces_USB_Manager_noarch.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: Droidspaces_USB_Manager_noarch.rpm

  build-arch:
    name: Arch (.pkg.tar.zst)
    needs: check-version
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: 准备构建环境并安装依赖
        run: |
          pacman -Syu --noconfirm --needed base-devel \
            python python-pyqt5 util-linux android-tools ntfs-3g exfatprogs \
            gvfs gvfs-mtp kio-extras xdg-utils
          useradd -m builder
      - name: 打源码包并构建 Arch 包
        run: |
          mkdir -p "usb-manager-${VERSION}"
          cp -r src icons desktop LICENSE README.md "usb-manager-${VERSION}/"
          rm -rf "usb-manager-${VERSION}/src/__pycache__"
          tar czf "usb-manager-${VERSION}.tar.gz" "usb-manager-${VERSION}"
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          chown -R builder:builder .
          su builder -c "cd $PWD && makepkg -f"
          mv ./*.pkg.tar.zst Droidspaces_USB_Manager_any.pkg.tar.zst
          ls -la Droidspaces_USB_Manager_any.pkg.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: Droidspaces_USB_Manager_any.pkg.tar.zst
