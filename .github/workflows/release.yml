name: Build Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.3）'
        required: true
        default: '1.3'

jobs:
  build-deb:
    name: Debian/Ubuntu (.deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 更新版本号并构建 deb
        run: |
          sed -i "s/^Version: .*/Version: ${{ inputs.version }}-1/" debian/DEBIAN/control
          dpkg-deb --build debian "usb-manager_${{ inputs.version }}-1_all.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: usb-manager_*.deb

  build-rpm:
    name: Fedora (.rpm)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: 准备构建环境
        run: dnf install -y --setopt=retries=5 --setopt=timeout=30 rpm-build tar
      - name: 打源码包并构建 rpm
        run: |
          mkdir -p "usb-manager-${{ inputs.version }}"
          cp -r src icons desktop LICENSE README.md "usb-manager-${{ inputs.version }}/"
          rm -rf "usb-manager-${{ inputs.version }}/src/__pycache__"
          tar czf "usb-manager-${{ inputs.version }}.tar.gz" "usb-manager-${{ inputs.version }}"
          sed -i "s/^Version:.*/Version: ${{ inputs.version }}/" usb-manager.spec
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp "usb-manager-${{ inputs.version }}.tar.gz" rpmbuild/SOURCES/
          cp usb-manager.spec rpmbuild/SPECS/
          rpmbuild -bb --define "_topdir $PWD/rpmbuild" rpmbuild/SPECS/usb-manager.spec
          cp rpmbuild/RPMS/noarch/*.rpm .
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: ./*.rpm

  build-arch:
    name: Arch (.pkg.tar.zst)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: 准备构建环境并安装依赖
        run: |
          pacman -Syu --noconfirm --needed base-devel \
            python python-pyqt5 util-linux android-tools ntfs-3g exfatprogs \
            gvfs-mtp gvfs-fuse kio-extras xdg-utils
          useradd -m builder
      - name: 打源码包并构建 Arch 包
        run: |
          mkdir -p "usb-manager-${{ inputs.version }}"
          cp -r src icons desktop LICENSE README.md "usb-manager-${{ inputs.version }}/"
          rm -rf "usb-manager-${{ inputs.version }}/src/__pycache__"
          tar czf "usb-manager-${{ inputs.version }}.tar.gz" "usb-manager-${{ inputs.version }}"
          sed -i "s/^pkgver=.*/pkgver=${{ inputs.version }}/" PKGBUILD
          chown -R builder:builder .
          su builder -c "cd $PWD && makepkg -f"
          cp ./*.pkg.tar.zst .
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: ./*.pkg.tar.zst
